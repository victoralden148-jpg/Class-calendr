<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 736" width="512" height="512">
  <defs>
    <!-- Clip Path untuk membatasi area icon -->
    <clipPath id="squircle">
      <rect x="120" y="118" width="498" height="498" rx="150" />
    </clipPath>

    <!-- Gradien Latar Belakang Biru -->
    <linearGradient id="bgBlue" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#1c6fe8" />
      <stop offset="0.55" stop-color="#2b86f0" />
      <stop offset="1" stop-color="#4aa6f9" />
    </linearGradient>

    <!-- Gradien Folder Kuning Depan -->
    <linearGradient id="folderYellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe064" />
      <stop offset="0.55" stop-color="#ffc83e" />
      <stop offset="1" stop-color="#ffab2c" />
    </linearGradient>

    <!-- Gradien Tab Folder Kuning -->
    <linearGradient id="tabYellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe780" />
      <stop offset="1" stop-color="#ffcf45" />
    </linearGradient>

    <!-- Gradien Folder Tengah (Putih) -->
    <linearGradient id="folderWhite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf8" />
      <stop offset="1" stop-color="#f1e6d2" />
    </linearGradient>

    <!-- Gradien Folder Belakang (Biru Muda) -->
    <linearGradient id="folderLightBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9cc8ff" />
      <stop offset="1" stop-color="#cfe3ff" />
    </linearGradient>

    <!-- Gradien Mata/Mulut -->
    <linearGradient id="brownFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#94461c" />
      <stop offset="1" stop-color="#6e3010" />
    </linearGradient>

    <!-- Filter Bayangan Latar -->
    <filter id="shadowBg" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#0b3a8a" flood-opacity="0.22" />
    </filter>

    <!-- Filter Bayangan Folder -->
    <filter id="shadowFolder" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="-6" stdDeviation="7" flood-color="#7a4a00" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- ==================== LATAR BELAKANG ICON (BIRU) ==================== -->
  <g filter="url(#shadowBg)">
    <rect x="120" y="118" width="498" height="498" rx="150" fill="url(#bgBlue)" />
  </g>

  <!-- ==================== AREA GAMBAR FOLDER ==================== -->
  <g clip-path="url(#squircle)">
    
    <!-- Lapisan Folder Belakang (Biru Muda) -->
    <path d="M352 262 L612 292 L630 294 L530 310 V392 L410 322 L340 288 L330 270 C352 262 352 262 352 262 Z" fill="url(#folderLightBlue)" opacity="0.85" />
    <path d="M408 312 L630 348 V398 L424 332 Z" fill="#eef5ff" opacity="0.9" />

    <!-- Lapisan Folder Tengah (Putih) -->
    <path d="M242 274 L230 282 L226 302 L220 352 L424 352 L410 322 L404 312 L392 308 L272 272 L254 266 L242 274 Z" fill="url(#tabYellow)" />
    <path d="M266 324 L250 330 L258 348 L268 362 L606 418 L614 396 L606 388 L280 322 L272 321 L266 324 Z" fill="url(#folderWhite)" />

    <!-- Lapisan Folder Depan (Kuning) -->
    <g filter="url(#shadowFolder)">
      <path d="M206 350 L190 352 L182 372 L140 566 L136 598 L68 606 L196 618 L262 618 H640 V430 L640 424 L630 422 L216 348 L210 347 L206 350 Z" fill="url(#folderYellow)" />
    </g>
    
    <!-- Highlight Atas Folder Kuning -->
    <path d="M208 352 L624 426" stroke="#fff3a8" stroke-width="5" stroke-linecap="round" opacity="0.7" />
    
    <!-- Bayangan Dalam Folder Kuning -->
    <path d="M150 560 L140 600 L176 510 L262 618 H640 V600 L420 612 L190 590 L150 584 L150 560 Z" fill="#ff9f1c" opacity="0.35" />

    <!-- Wajah Folder (Mata Kiri, Mata Kanan, Mulut) -->
    <ellipse cx="275" cy="476" rx="29" ry="39" transform="rotate(-6 275 476)" fill="url(#brownFace)" />
    <ellipse cx="461" cy="509" rx="29" ry="39" transform="rotate(-6 461 509)" fill="url(#brownFace)" />
    <path d="M326 543 Q362 566 398 549" stroke="url(#brownFace)" stroke-width="24" stroke-linecap="round" fill="none" />

  </g>
</svg>
