<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <!-- Shadows for the white app icon boxes -->
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="15" flood-color="#000000" flood-opacity="0.08" />
    </filter>

    <!-- Heavy blur for the outer neon glow -->
    <filter id="outerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
    </filter>

    <!-- Soft blur for the main body shape to give a painted/soft-focus look -->
    <filter id="bodyBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
    </filter>

    <!-- Subtle blur for the eyes -->
    <filter id="eyeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" />
    </filter>

    <!-- Gradients for Left Icon (Cyan/Blue) -->
    <linearGradient id="gradLeftBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="70%" stop-color="#0088ff" />
      <stop offset="100%" stop-color="#0044ff" />
    </linearGradient>
    <linearGradient id="gradLeftGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#ff44cc" />
    </linearGradient>

    <!-- Gradients for Middle Icon (Pink) -->
    <linearGradient id="gradMidBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb3d9" />
      <stop offset="100%" stop-color="#ff33a8" />
    </linearGradient>
    <linearGradient id="gradMidGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff66c4" />
      <stop offset="100%" stop-color="#ff00ff" />
    </linearGradient>

    <!-- Gradients for Right Icon (Purple/Cyan) -->
    <linearGradient id="gradRightBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ffff" />
      <stop offset="40%" stop-color="#3300ff" />
      <stop offset="100%" stop-color="#9900ff" />
    </linearGradient>
    <linearGradient id="gradRightGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ffff" />
      <stop offset="50%" stop-color="#3300ff" />
      <stop offset="100%" stop-color="#ff00aa" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="#f2f2f2" />

  <!-- ================= ICON 1 (LEFT) ================= -->
  <g transform="translate(120, 120)">
    <!-- White App Icon Base -->
    <rect x="0" y="0" width="160" height="160" rx="36" fill="#ffffff" filter="url(#boxShadow)" />
    
    <!-- Ghost Outer Glow -->
    <path d="M 35 80 A 45 40 0 0 1 125 80 L 125 105 A 20 20 0 0 1 105 125 L 55 125 A 20 20 0 0 1 35 105 Z" 
          fill="url(#gradLeftGlow)" filter="url(#outerGlow)" />
          
    <!-- Ghost Main Body -->
    <path d="M 35 80 A 45 40 0 0 1 125 80 L 125 105 A 20 20 0 0 1 105 125 L 55 125 A 20 20 0 0 1 35 105 Z" 
          fill="url(#gradLeftBody)" filter="url(#bodyBlur)" />
          
    <!-- Eyes -->
    <ellipse cx="60" cy="90" rx="10" ry="15" fill="#ffffff" filter="url(#eyeGlow)" />
    <ellipse cx="100" cy="90" rx="10" ry="15" fill="#ffffff" filter="url(#eyeGlow)" />
  </g>

  <!-- ================= ICON 2 (MIDDLE) ================= -->
  <g transform="translate(320, 120)">
    <!-- White App Icon Base -->
    <rect x="0" y="0" width="160" height="160" rx="36" fill="#ffffff" filter="url(#boxShadow)" />
    
    <!-- Ghost Outer Glow -->
    <path d="M 35 80 A 45 40 0 0 1 125 80 L 125 105 A 20 20 0 0 1 105 125 L 55 125 A 20 20 0 0 1 35 105 Z" 
          fill="url(#gradMidGlow)" filter="url(#outerGlow)" />
          
    <!-- Ghost Main Body -->
    <path d="M 35 80 A 45 40 0 0 1 125 80 L 125 105 A 20 20 0 0 1 105 125 L 55 125 A 20 20 0 0 1 35 105 Z" 
          fill="url(#gradMidBody)" filter="url(#bodyBlur)" />
          
    <!-- Eyes -->
    <ellipse cx="60" cy="90" rx="10" ry="15" fill="#ffffff" filter="url(#eyeGlow)" />
    <ellipse cx="100" cy="90" rx="10" ry="15" fill="#ffffff" filter="url(#eyeGlow)" />
  </g>

  <!-- ================= ICON 3 (RIGHT) ================= -->
  <g transform="translate(520, 120)">
    <!-- White App Icon Base -->
    <rect x="0" y="0" width="160" height="160" rx="36" fill="#ffffff" filter="url(#boxShadow)" />
    
    <!-- Ghost Outer Glow -->
    <path d="M 35 80 A 45 40 0 0 1 125 80 L 125 105 A 20 20 0 0 1 105 125 L 55 125 A 20 20 0 0 1 35 105 Z" 
          fill="url(#gradRightGlow)" filter="url(#outerGlow)" />
          
    <!-- Ghost Main Body -->
    <path d="M 35 80 A 45 40 0 0 1 125 80 L 125 105 A 20 20 0 0 1 105 125 L 55 125 A 20 20 0 0 1 35 105 Z" 
          fill="url(#gradRightBody)" filter="url(#bodyBlur)" />
          
    <!-- Eyes -->
    <ellipse cx="60" cy="90" rx="10" ry="15" fill="#ffffff" filter="url(#eyeGlow)" />
    <ellipse cx="100" cy="90" rx="10" ry="15" fill="#ffffff" filter="url(#eyeGlow)" />
  </g>
</svg>
