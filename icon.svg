<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="lightGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A0E7E5"/>
      <stop offset="50%" stop-color="#FFB6C1"/>
      <stop offset="100%" stop-color="#C9A0FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#lightGrad)"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#fff" stroke-width="12" opacity="0.9" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="60" fill="#fff" opacity="0.9" filter="url(#glow)"/>
  <path d="M256 160v192M160 256h192" stroke="#fff" stroke-width="12" stroke-linecap="round" opacity="0.8" filter="url(#glow)"/>
