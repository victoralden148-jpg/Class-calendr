<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <!-- Blur untuk efek cahaya luar (Pink) -->
    <filter id="glowPink" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="55" />
    </filter>

    <!-- Blur untuk sorotan atas (Cyan) -->
    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30" />
    </filter>

    <!-- Blur utama untuk badan karakter (Soft Airbrush) -->
    <filter id="bodyBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" />
    </filter>

    <!-- Blur untuk mata -->
    <filter id="eyeBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" />
    </filter>

    <!-- Gradient Warna Badan (Biru) -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" />
      <stop offset="45%" stop-color="#0077ff" />
      <stop offset="100%" stop-color="#0033ff" />
    </linearGradient>

    <!-- Gradient Warna Glow Pink di Belakang -->
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff88ff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ff00ff" stop-opacity="0.4" />
    </linearGradient>

    <!-- Gradient Warna Mata (Putih kebiruan) -->
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#b3e6ff" />
    </linearGradient>
  </defs>

  <!-- BASE ICON APP (Kotak Melengkung Putih) - Background tetap transparan -->
  <!-- Bentuk Squircle standar icon aplikasi -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="#ffffff" />

  <!-- KARAKTER DI DALAM ICON (Posisi di tengah) -->
  <g transform="translate(512, 512)">
    
    <!-- 1. Efek Pendaran / Glow Pink (Di belakang) -->
    <path d="M -320 20 
             A 320 280 0 0 1 320 20 
             L 320 180 
             Q 320 320 180 320 
             L -180 320 
             Q -320 320 -320 180 Z" 
          fill="url(#pinkGrad)" filter="url(#glowPink)" />

    <!-- 2. Sorotan Cahaya Cyan di Bagian Atas -->
    <path d="M -280 10 
             A 280 250 0 0 1 280 10" 
          fill="none" stroke="#00ffff" stroke-width="60" 
          filter="url(#glowCyan)" opacity="0.9" />

    <!-- 3. Badan Utama Karakter (Biru) -->
    <path d="M -310 20 
             A 310 270 0 0 1 310 20 
             L 310 180 
             Q 310 300 180 300 
             L -180 300 
             Q -310 300 -310 180 Z" 
          fill="url(#bodyGrad)" filter="url(#bodyBlur)" />

    <!-- 4. Mata Kiri -->
    <ellipse cx="-105" cy="70" rx="60" ry="100" fill="url(#eyeGrad)" filter="url(#eyeBlur)" />
    
    <!-- 5. Mata Kanan (Sedikit lebih rendah dan miring) -->
    <ellipse cx="115" cy="85" rx="60" ry="100" fill="url(#eyeGrad)" filter="url(#eyeBlur)" 
             transform="rotate(8 115 85)" />

  </g>
</svg>
