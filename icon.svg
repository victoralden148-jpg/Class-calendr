<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="darkGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00FFAA"/>
      <stop offset="50%" stop-color="#FF00FF"/>
      <stop offset="100%" stop-color="#8A2BE2"/>
    </linearGradient>
    <filter id="glowDark" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="120" fill="#000000"/>
  <rect width="512" height="512" rx="120" fill="url(#darkGrad)" opacity="0.15"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#00FFAA" stroke-width="12" opacity="0.9" filter="url(#glowDark)"/>
  <circle cx="256" cy="256" r="60" fill="#FF00FF" opacity="0.8" filter="url(#glowDark)"/>
  <path d="M256 160v192M160 256h192" stroke="#00FFAA" stroke-width="12" stroke-linecap="round" opacity="0.8" filter="url(#glowDark)"/>
