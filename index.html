async function recStart(){
 if(!navigator.mediaDevices||!window.MediaRecorder)return toast('Perekam suara belum didukung di browser ini');
 try{const st=await navigator.mediaDevices.getUserMedia({audio:true});
  const mt=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'].find(t=>MediaRecorder.isTypeSupported(t))||'';
  const mr=mt?new MediaRecorder(st,{mimeType:mt}):new MediaRecorder(st);
  const r={mr,st,ch:[],t0:Date.now()};REC=r;

 if(S.capBusy)return;if(!capAv())return toast('Belum ada kapsul. Naikkan streak dulu!');
 S.capBusy=1;const ps=petState(S.user.id),tot=ps.best+ps.gb;
 const ov=mkEl(`<div class="cvdim"></div><div class="cvrays"></div><div class="cvstage"><div class="cvcp">${capSvg()}</div><div class="cvrv"></div><div class="cvcf"></div></div><p class="cvhint">Kapsul bergetar…</p>`,'cvov cvcap');
 document.body.appendChild(ov);requestAnimationFrame(()=>ov.classList.add('s-drop'));
 setTimeout(()=>ov.classList.add('s-shake'),850);
 const[r]=await Promise.all([sb.rpc('open_capsule',{p_total:tot}),sleep(2100)]);
 if(r.error){S.capBusy=0;ov.remove();return toast(r.error.message)}
 const d=r.data,it=IM[d.item],R=RAR[it.r];
 ov.style.setProperty('--g',R.g);ov.classList.add('rv'+it.r);if(it.r===4)ov.classList.add('secret');
 ov.querySelector('.cvhint').textContent='';
 ov.classList.remove('s-shake');ov.classList.add('s-burst');ov.querySelector('.cvcf').innerHTML=cvConfetti(it.r>=3?46:26);
 try{navigator.vibrate&&navigator.vibrate(it.r>=3?[40,50,90,50,140]:[40,40,60])}catch(e){}
 await sleep(520);
 const big=it.t==='kc'?cardHtml(it.id,220):itemArt(it.id,it.t==='sc'?210:170);
 ov.querySelector('.cvrv').innerHTML=`<span class="cvrar r${it.r}">${it.r===4?'✨ RAHASIA ✨':R.n}</span><div class="cvbig">${big}</div><h2>${it.n}</h2><p>${it.d}</p>${d.dup?`<span class="cvdup">Duplikat · kamu punya ×${d.qty}</span>`:'<span class="cvnew">BARU!</span>'}${it.t==='sc'&&!d.dup?'<small>Pakai lewat Profil › Ganti karakter, atau buka lagi di Ruang Kemenangan.</small>':''}<div class="cvbt"><button class="cvgo" data-pa="cvdone">Ambil</button></div>`;
 ov.classList.add('s-show');
 await refresh();S.capBusy=0;
 const o=S.k6||{};
 if(capAv()>0){const b=ov.querySelector('.cvbt');b.insertAdjacentHTML('beforeend',`<button class="cvx" data-pa="cvagain">Buka lagi (${capAv()})</button>`)}}
async function useSec(id){const n=+id.slice(1),m=S.me;const r=await sb.rpc('set_pet5',{p_char:n,p_name:m.pet_name||CH[n].n,p_skin:m.pet_skin==null?null:m.pet_skin,p_uname:null});if(r.error)return toast(r.error.message);cvClose();toast(CH[n].n+' sekarang jadi karakterku! ✨');await refresh()}
async function unlockAll(){const v=(($('#cvcode')||{}).value||'').trim();if(!v)return toast('Masukkan kode dulu');const r=await sb.rpc('unlock_all',{p_code:v});if(r.error)return toast(r.error.message);const d=r.data||{};if(d.locked)return toast('Terlalu banyak percobaan salah.');if(!d.ok)return toast('Kode salah'+(d.left!=null?' (sisa '+d.left+' percobaan)':''));toast('Semua koleksi terbuka! 🎉');await refresh();render()}
document.addEventListener('click',e=>{const t=e.target.closest('[data-pa]');if(!t)return;const d=t.dataset,a=d.pa;
 if(a==='cap')openCap();
 else if(a==='itm')cvDetail(d.id);
 else if(a==='cvx')cvClose();
 else if(a==='cvdone'){cvClose();S.capBusy=0;render()}
 else if(a==='cvagain'){cvClose();setTimeout(openCap,300)}
 else if(a==='usech')useSec(d.id);
 else if(a==='ucode')unlockAll()});
document.addEventListener('click',e=>{if(e.target.classList&&e.target.classList.contains('cvov')&&e.target.classList.contains('cvd'))cvClose()});
/* ===== layar masuk baru ===== */
const AX=['Hello~','Hai, selamat datang!','Ayo masuk ke kelas~','Kelasmu menunggu 💛','Yuk absen bareng!','Jangan lupa streak-nya 🔥','Hehe, geli!','Kamu pasti bisa ✨'];
const aeye=(x,y,s,o)=>`<span class="aey${o&&o.wk?' wnk':''}${o&&o.sl?' sl':''}" style="left:${x}%;top:${y}%;width:${s}%"><i class="app"></i></span>`;
const amo={smile:'<path d="M4 4Q20 22 36 4" stroke="#111" stroke-width="5.4" fill="none" stroke-linecap="round"/>',open:'<path d="M3 3Q20 -3 37 3Q35 25 20 25Q5 25 3 3z" fill="#e8283c"/><path d="M5 4Q20 0 35 4L34 9Q20 6 6 9z" fill="#fff"/><path d="M12 22Q20 14 28 22" fill="#ff8a9a"/>',o:'<ellipse cx="20" cy="12" rx="6" ry="7" fill="#111"/>',flat:'<path d="M12 10H28" stroke="#111" stroke-width="4.4" stroke-linecap="round"/>',tiny:'<path d="M10 6Q20 14 30 6" stroke="#111" stroke-width="4" fill="none" stroke-linecap="round"/>'};
const amh=(k,x,y,w)=>`<svg class="amo" viewBox="0 0 40 28" style="left:${x}%;top:${y}%;width:${w}%">${amo[k]}</svg>`;
const ABL=[
 {x:-11,y:15,s:46,c:['#eaffc4','#5fd13a'],h:'M4 44Q10 6 54 14Q40 4 34 -8M2 70Q-2 56 8 50',f:aeye(30,32,22,{wk:1})+aeye(56,28,22)+amh('smile',40,54,26)},
 {x:42,y:11,s:17,c:['#ffd0ec','#ff7ac8'],h:'',f:aeye(26,40,16,{sl:1})+aeye(60,40,16,{sl:1})+amh('tiny',36,64,28)},
 {x:60,y:19,s:43,c:['#ffe0d6','#ff5a4a'],h:'M10 12Q44 -12 96 14Q108 -4 92 -2Q82 4 96 22',f:aeye(30,32,23)+aeye(58,28,23)+amh('open',40,60,32)},
 {x:-14,y:54,s:52,c:['#cfeaff','#3d8df0'],h:'M-2 34Q30 8 62 8M30 10Q44 2 58 6',f:aeye(38,36,21)+aeye(62,34,21)+amh('smile',46,64,22)},
 {x:55,y:54,s:49,c:['#fff0bd','#ffb21e'],h:'M96 36Q104 8 70 4Q60 24 88 40M10 6Q4 -6 20 -4',f:aeye(26,38,22,{wk:1})+aeye(52,36,22)+amh('smile',30,66,26)},
 {x:38,y:76,s:16,c:['#ffe0c4','#ff9a4a'],h:'',f:aeye(24,38,19)+aeye(58,38,19)+'<svg class="agl" viewBox="0 0 100 100"><circle cx="34" cy="48" r="20" fill="none" stroke="#111" stroke-width="4.4"/><circle cx="68" cy="48" r="20" fill="none" stroke="#111" stroke-width="4.4"/><path d="M52 46Q54 42 56 46" stroke="#111" stroke-width="4" fill="none"/></svg>'+amh('o',40,70,18)}
];
function authHtml(){const up=S.authMode==='up',first=!S._axShown;S._axShown=1;
 return `<div class="ax${first?'':' nz'}" id="ax"><div class="axs"><h1 class="awm" aria-label="kelasku">${'kelasku'.split('').map((c,i)=>`<span style="--i:${i}">${c}</span>`).join('')}</h1>
<div class="astg">${ABL.map((b,i)=>`<div class="abl b${i}" data-b="${i}" style="left:${b.x}%;top:${b.y}%;width:${b.s}%;--c1:${b.c[0]};--c2:${b.c[1]};--d:${(i*.7).toFixed(1)}s"><div class="abi"><span class="aba"></span>${b.h?`<svg class="bhr" viewBox="0 0 100 100" overflow="visible"><path d="${b.h}" stroke="#111" stroke-width="5.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`:''}<div class="afc">${b.f}<i class="ahd l"></i><i class="ahd r"></i></div></div></div>`).join('')}
<div class="ahi" id="ahi"><span>${up?'Selamat datang!':'Hello~'}</span></div><svg class="aw1" viewBox="0 0 30 12"><path d="M2 8Q6 0 10 8T18 8T28 6" stroke="#ff5aa0" stroke-width="2.6" fill="none" stroke-linecap="round"/></svg><i class="adh d1"></i><i class="adh d2"></i></div></div>
<div class="ash"><p class="ast">${up?'Buat akunmu untuk mulai':'Masuk untuk mulai'}</p><div class="seg"><button data-am="in" class="${up?'':'on'}">Masuk</button><button data-am="up" class="${up?'on':''}">Daftar</button></div>
${up?'<input id="an" placeholder="Nama lengkap" aria-label="Nama lengkap" autocomplete="name">':''}<input id="ae" type="email" placeholder="Email" aria-label="Email" autocomplete="email"><input id="ap" type="password" placeholder="Kata sandi (min. 6 karakter)" aria-label="Kata sandi" autocomplete="${up?'new-password':'current-password'}">
<button class="btn abtn" data-act="auth">${up?'Daftar sekarang':'Masuk'}</button><button class="alk" data-act="resetcfg">Ubah koneksi Supabase</button></div></div>`}
let axI=0,axP=null,axT=0,axSayT=0;
function axLook(){const x=document.querySelector('.ax');if(!x)return;const p=x.classList.contains('typ')?[innerWidth/2,innerHeight]:axP;if(!p)return;
 x.querySelectorAll('.aey').forEach(e=>{const r=e.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=p[0]-cx,dy=p[1]-cy,dd=Math.hypot(dx,dy)||1,m=Math.min(dd,r.width*.5)*.5,k=m/dd;e.style.setProperty('--tx',(dx*k).toFixed(1)+'px');e.style.setProperty('--ty',(dy*k).toFixed(1)+'px')})}
function axSay(t){const h=document.getElementById('ahi');if(!h)return;h.innerHTML=`<span>${t}</span>`;h.classList.remove('pop');void h.offsetWidth;h.classList.add('pop')}
function authInit(){
 const x=document.getElementById('ax');if(!x)return;
 setTimeout(()=>{x.classList.add('nz')},1600);axLook();
 if(axI)return;axI=1;
 let raf=0;const mv=e=>{const t=e.touches?e.touches[0]:e;axP=[t.clientX,t.clientY];axT=Date.now();if(!raf)raf=requestAnimationFrame(()=>{raf=0;axLook()})};
 ['pointermove','pointerdown','touchmove','touchstart'].forEach(n=>document.addEventListener(n,mv,{passive:true}));
 document.addEventListener('focusin',e=>{const a=document.getElementById('ax');if(!a)return;const id=e.target.id;a.classList.toggle('pw',id==='ap');a.classList.toggle('typ',id==='ae'||id==='an');
  if(id==='ap')axSay('Aku tidak ngintip kok 🙈');else if(id==='ae')axSay('Tulis emailmu ya ✍️');else if(id==='an')axSay('Siapa namamu? 😊');axLook()});
 document.addEventListener('focusout',e=>{const a=document.getElementById('ax');if(a&&(e.target.id==='ap'||e.target.id==='ae'||e.target.id==='an')){a.classList.remove('pw','typ');axSay(AX[Math.floor(Math.random()*AX.length)])}});
 document.addEventListener('click',e=>{const b=e.target.closest('.ax .abl'),w=e.target.closest('.awm span');
  if(b){b.classList.remove('poke');void b.offsetWidth;b.classList.add('poke');b.classList.add('wink');setTimeout(()=>b.classList.remove('wink'),700);axSay(AX[1+Math.floor(Math.random()*(AX.length-1))]);try{navigator.vibrate&&navigator.vibrate(12)}catch(_){}}
  else if(w){w.classList.remove('bn');void w.offsetWidth;w.classList.add('bn')}
  else if(e.target.closest('[data-am]')){const up=e.target.closest('[data-am]').dataset.am==='up';setTimeout(()=>{const hh=document.getElementById('ahi');if(hh)hh.firstChild.textContent=up?'Selamat datang!':'Hello~'},0)}});
 setInterval(()=>{const a=document.getElementById('ax');if(!a)return;
  const bl=a.querySelectorAll('.abl'),b=bl[Math.floor(Math.random()*bl.length)];b.classList.add('blink');setTimeout(()=>b.classList.remove('blink'),160);
  if(Date.now()-axT>3500){axP=[innerWidth*(.15+Math.random()*.7),innerHeight*(.1+Math.random()*.5)];axLook()}},2400);
 setInterval(()=>{const a=document.getElementById('ax');if(a&&!a.classList.contains('pw')&&!a.classList.contains('typ')&&Date.now()-axSayT>9000){axSayT=Date.now();axSay(AX[Math.floor(Math.random()*AX.length)])}},5200)}
const _rd6=render;
render=function(){_rd6.apply(this,arguments);if(!S.user)authInit()};
})();

boot();
</script>
