<div class="box"><b>Anggota (${S.members.length})</b>${S.members.map(x=>{const p=x.pet_char!=null?petState(x.user_id):null;return `<div class="mem">${avP(x,40)}<div>${esc(x.name)}${x.pet_name?` <span class="mu">· ${esc(x.pet_name)}</span>`:''}<br><span class="mu">${x.role==='admin'?'Ketua':'Anggota'}${p?` · 🔥 ${p.cur}`:''}</span></div>${admin()&&x.user_id!==S.user.id?`<button class="mu" data-pa="gift" data-u="${x.user_id}" aria-label="Hadiah">🎁</button><button class="mu" data-promote="${x.user_id}" data-r="${x.role}">${x.role==='admin'?'Jadikan anggota':'Jadikan admin'}</button>`:''}</div>`}).join('')}</div>
<button class="btn s" data-pa="fs" style="margin-bottom:10px">Layar penuh</button>
<button class="btn s" data-act="lite" style="margin-bottom:10px">${document.documentElement.classList.contains('lite')?'Efek kaca: mati (mode ringan)':'Efek kaca: aktif'}</button><button class="btn s" data-act="leave" style="margin-bottom:10px">Keluar dari kelas</button><button class="btn d" data-act="logout">Keluar akun</button></div>`}
meTab=meTab2;
function giftModal(uid){const m=S.members.find(x=>x.user_id===uid);if(!m)return;
modal={form:true,html:()=>`<h2>Hadiah untuk ${esc(m.name)}</h2><p class="mu">Pilih karakter dan skin. Skin langsung terbuka untuknya.</p><label for="gc">Karakter</label><select id="gc">${CH.map((c,i)=>`<option value="${i}" ${i===m.pet_char?'selected':''}>${c.n} (${c.sp})</option>`).join('')}</select><label for="gk">Skin</label><select id="gk">${STN.map((s,i)=>`<option value="${i}">${i+1}. ${s}</option>`).join('')}</select><button class="btn" id="gb">Berikan</button>`,
bind:o=>{o.querySelector('#gb').onclick=async()=>{const c=+o.querySelector('#gc').value,s=+o.querySelector('#gk').value;if(await db(sb.from('members').update({pet_char:c,pet_skin:s,pet_gift:s}).eq('class_id',S.cls.id).eq('user_id',uid),'Hadiah terkirim 🎁'))closeModal()}}};render()}
/* ---------- events ---------- */
function hearts(n,em){const f=$('#hfx');if(!f)return;for(let i=0;i<n;i++){const h=document.createElement('span');h.className='heart';h.textContent=em||'💖';h.style.left=(30+Math.random()*40)+'%';h.style.animationDelay=(i*.12)+'s';f.append(h);setTimeout(()=>h.remove(),1600)}}
function petAnim(cls,ms){const s=document.querySelector('.hpet svg');if(!s)return;s.classList.add(cls);setTimeout(()=>s.classList.remove(cls),ms)}
function pickSel(i){S.pk=i;document.querySelectorAll('.pk').forEach((b,j)=>b.classList.toggle('on',j===i));const b=$('#pkbig');if(b)b.innerHTML=pkBig(i);const n=$('#pkn');if(n&&!S.pkEd)n.value=CH[i].n;const g=$('#pkgo');if(g)g.textContent='Pilih '+CH[i].n}
document.addEventListener('input',e=>{if(e.target.id==='pkn')S.pkEd=1});
document.addEventListener('click',async ev=>{
const t=ev.target.closest('[data-pa]');if(!t)return;const d=t.dataset,a=d.pa,m=S.me;
if(a==='pick')pickSel(+d.i);
else if(a==='pickgo'){const i=S.pk==null?(m.pet_char||0):S.pk,nm2=(($('#pkn').value||'').trim()||CH[i].n).slice(0,14),first=m.pet_char==null;
 if(await db(sb.rpc('set_pet',{p_char:i,p_name:nm2,p_skin:null,p_uname:null}),first?'Selamat datang, '+nm2+'! 🎉':'Karakter diganti')){S.tab='home';S.pk=null;S.pkEd=0;render()}}
else if(a==='chchar'){S.tab='pick';S.pk=m.pet_char;S.pkEd=0;render()}
else if(a==='savenames'){const pn=($('#pn').value||'').trim().slice(0,14),un=($('#un').value||'').trim();db(sb.rpc('set_pet',{p_char:m.pet_char,p_name:pn||CH[m.pet_char].n,p_skin:m.pet_skin==null?null:m.pet_skin,p_uname:un||null}),'Nama disimpan')}
else if(a==='skin'){const i=+d.i,ps=petState(S.user.id);if(i>ps.unlocked)return toast('Terkunci. Capai streak '+TH[i]+' hari untuk membuka.');db(sb.rpc('set_pet',{p_char:m.pet_char,p_name:m.pet_name||CH[m.pet_char].n,p_skin:i,p_uname:null}),'Skin '+STN[i]+' dipakai')}
else if(a==='pet'){petAnim('tap',650);hearts(3);if(navigator.vibrate)navigator.vibrate(20)}
else if(a==='play'){petAnim('dance',1700);hearts(6,'✨');toast('Seru banget! Dia senang main bareng kamu')}
else if(a==='feed'){const f=getFeed();if(f.n>=3)return toast('Dia sudah kenyang. Besok lagi ya!');f.n++;try{localStorage.setItem('kfeed',JSON.stringify(f))}catch(e){}render();petAnim('tap',650);hearts(4,'🍙');toast('Nyam nyam! Enak banget 😋')}
else if(a==='gift')giftModal(d.u);
else if(a==='fs'){try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){toast('Layar penuh tidak didukung. Pasang aplikasi lewat Instal aplikasi.')}}
else if(a==='kmon'){const[y,mo]=S.kasMon.split('-').map(Number),n=new Date(y,mo-1+ +d.d,1);S.kasMon=n.getFullYear()+'-'+pad(n.getMonth()+1);render()}
else if(a==='kq'&&admin())txForm({mem:d.u,cat:'Iuran'});
else if(a==='kdel'){if(confirm('Hapus transaksi ini?'))db(sb.from('kas_tx').delete().eq('id',d.id),'Dihapus')}
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.user){S._ci=0;refresh()}});
})();

boot();
</script>
</body>
</html>
