 else if(d.mood!==undefined){db(sb.from('moods').upsert({class_id:CID(),user_id:S.user.id,day:key(new Date()),mood:+d.mood},{onConflict:'class_id,user_id,day'}),'Mood tercatat '+MOODS[+d.mood][0])}
 else if(d.done){const has=S.task_done.some(x=>x.task_id===d.done&&x.user_id===S.user.id);db(has?sb.from('task_done').delete().eq('task_id',d.done).eq('user_id',S.user.id):sb.from('task_done').insert({task_id:d.done,class_id:CID(),user_id:S.user.id}))}

function evModal(id){
 modal={form:false,html:()=>{const e=S.events.find(x=>x.id===id);if(!e)return'<p>Acara tidak ditemukan.</p>';const ph=S.media.filter(x=>x.event_id===id),at=attOf(id).length;
 return `<h2 style="margin-top:4px">${emo(e.category)} ${esc(e.title)}</h2><p class="mu">${fmt(dk(e))} · ${tm(e)} · ${esc(e.location)}</p><p style="margin:12px 0">${esc(e.description)}</p><p class="mu">${at} dari ${S.members.length} anggota sudah hadir</p>
 <div class="sh" style="padding:16px 0 0"><span>Galeri kenangan</span></div><div class="gal">${ph.map(p=>p.kind==='video'?`<video src="${url(p.path)}" controls preload="metadata"></video>`:`<a href="${url(p.path)}" target="_blank" rel="noopener"><img loading="lazy" src="${url(p.path)}" alt=""></a>`).join('')}</div>${ph.length?'':'<p class="mu">Belum ada foto atau video.</p>'}
 <div class="two" style="margin:12px 0 8px"><label class="btn s" style="cursor:pointer">Ambil foto<input type="file" id="cp" accept="image/*" capture="environment" hidden></label><label class="btn s" style="cursor:pointer">Rekam video<input type="file" id="cv" accept="video/*" capture="environment" hidden></label></div><label class="btn s" style="cursor:pointer;margin:0 0 10px">Pilih dari galeri<input type="file" id="up" accept="image/*,video/*" multiple hidden></label>
 ${admin()?'<div class="two"><button class="btn s" id="ed">Ubah</button><button class="btn d" id="dl">Hapus</button></div>':''}`},
 bind:o=>{const upl=async fs=>{toast('Mengunggah '+fs.length+' berkas…');
  for(const f0 of fs){if(f0.size>50*1048576)continue;const f=await shrink(f0);const p=`${S.cls.id}/${id}/${Date.now()}-${Math.random().toString(36).slice(2,7)}.${(f.name.split('.').pop()||'bin').toLowerCase()}`;
   const u=await sb.storage.from('media').upload(p,f,{contentType:f.type});if(u.error)continue;
   await sb.from('media').insert({event_id:id,class_id:S.cls.id,user_id:S.user.id,path:p,kind:f.type.startsWith('video')?'video':'image'})}
  toast('Selesai diunggah');refresh()};['up','cp','cv'].forEach(i=>{const el=o.querySelector('#'+i);el&&(el.onchange=ev=>upl([...ev.target.files]))});
  const ed=o.querySelector('#ed');if(ed){ed.onclick=()=>formModal(S.events.find(x=>x.id===id));o.querySelector('#dl').onclick=async()=>{if(!confirm('Hapus acara ini?'))return;await sb.from('events').delete().eq('id',id);closeModal();toast('Acara dihapus');refresh()}}}};
 render();
}

 const d=e?new Date(e.starts_at):new Date(S.sel+'T08:00'),v={t:e?e.title:'',date:key(d),time:pad(d.getHours())+':'+pad(d.getMinutes()),loc:e?e.location:'',cat:e?e.category:'Kelas',desc:e?e.description:''};

 <label for="f6">Deskripsi</label><textarea id="f6" rows="3">${esc(v.desc)}</textarea><button class="btn" id="fs">Simpan acara</button>`,
 bind:o=>{o.querySelector('#fs').onclick=async()=>{const t=o.querySelector('#f1').value.trim(),dt=o.querySelector('#f2').value,tt=o.querySelector('#f3').value;if(!t||!dt||!tt)return toast('Judul, tanggal, dan jam wajib diisi');

async function mark(uid,present){
 const eid=S.scanEv;if(!eid)return toast('Pilih acara dulu');
 const has=S.att.some(x=>x.event_id===eid&&x.user_id===uid);
 let r;if(present===true||(present===undefined&&!has))r=await sb.from('attendance').upsert({event_id:eid,user_id:uid,class_id:S.cls.id});else r=await sb.from('attendance').delete().eq('event_id',eid).eq('user_id',uid);
 if(r.error)return toast(r.error.message);await refresh();

async function shrink(f){if(!f.type.startsWith('image/')||f.type==='image/gif')return f;try{const b=await createImageBitmap(f),k=Math.min(1,1280/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);c.getContext('2d').drawImage(b,0,0,c.width,c.height);const bl=await new Promise(r=>c.toBlob(r,'image/jpeg',.82));return bl&&bl.size<f.size?new File([bl],f.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'}):f}catch(e){return f}}
let curCam=null;
async function openCam(id){
 if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
 const v={width:{ideal:1280},height:{ideal:720}};if(id)v.deviceId={exact:id};else v.facingMode={ideal:'environment'};
 stream=await navigator.mediaDevices.getUserMedia({audio:false,video:v});
 const tr=stream.getVideoTracks()[0];
 return (tr.getSettings()||{}).deviceId;
}
async function backCams(){const d=(await navigator.mediaDevices.enumerateDevices()).filter(x=>x.kind==='videoinput'&&/back|rear|belakang|environment/i.test(x.label));return d}
async function swapCam(){try{const bc=await backCams();if(bc.length<2)return toast('Hanya ada satu kamera belakang');const i=bc.findIndex(x=>x.deviceId===curCam);curCam=await openCam(bc[(i+1)%bc.length].deviceId);const v=document.querySelector('#camwrap video');if(v){v.srcObject=stream;await v.play()}toast('Kamera diganti')}catch(e){toast('Gagal mengganti kamera')} }
async function startCam(){
 try{curCam=await openCam(null)}catch(e){return toast('Kamera tidak bisa dibuka.')}
 const w=$('#camwrap');w.innerHTML='<video class="cam" playsinline muted></video><div class="two"><button class="btn s" data-act="swapcam">Ganti kamera</button><button class="btn s" data-act="stopcam">Tutup</button></div>';
 const v=w.querySelector('video');v.srcObject=stream;await v.play();
 const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});let last='',lt=0;
 const bd='BarcodeDetector' in window?new BarcodeDetector({formats:['qr_code']}):null;
 const tick=async()=>{if(!stream)return;
  if(v.readyState>=2){let txt=null;
   if(bd){try{const r=await bd.detect(v);if(r[0])txt=r[0].rawValue}catch(e){}}
   else{cv.width=v.videoWidth;cv.height=v.videoHeight;cx.drawImage(v,0,0);const q=jsQR(cx.getImageData(0,0,cv.width,cv.height).data,cv.width,cv.height);if(q)txt=q.data}
   if(txt&&(txt!==last||Date.now()-lt>4000)){last=txt;lt=Date.now();const p=txt.split(':');
    if(p[0]==='KELASKU'&&p[1]===S.cls.id){const m=S.members.find(x=>x.user_id===p[2]);if(m){await mark(p[2],true);toast(m.name+' tercatat hadir');if(navigator.vibrate)navigator.vibrate(80)}else toast('Anggota tidak dikenal')}else toast('QR bukan dari kelas ini')}}
  requestAnimationFrame(tick)};tick();
}
function stopCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}const w=$('#camwrap');if(w)w.innerHTML=''}
let timers=[];
function schedule(){timers.forEach(clearTimeout);timers=[];if(!('Notification' in window)||Notification.permission!=='granted')return;
 S.events.forEach(e=>{const ms=new Date(e.starts_at)-Date.now()-36e5;if(ms>0&&ms<2147e6)timers.push(setTimeout(()=>new Notification('Pengingat: '+e.title,{body:'Mulai pukul '+tm(e)}),ms))})}

document.addEventListener('change',e=>{if(e.target.id==='se'){S.scanEv=e.target.value;render()}});
setInterval(()=>{const el=document.getElementById('cd');if(el)el.textContent=cdText(new Date(el.dataset.t)-Date.now())+' lagi'},30000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
try{const p=localStorage.getItem('klite');if(p==='1'||(p===null&&navigator.deviceMemory&&navigator.deviceMemory<=2))document.documentElement.classList.add('lite')}catch(e){}
boot();
