.sp-ic:before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.85),rgba(255,255,255,0) 70%);animation:pls 2.2s ease-in-out infinite}
.sp-ic svg{position:relative;width:112px;height:112px;filter:drop-shadow(0 14px 18px rgba(70,80,150,.35));animation:flo 2.2s ease-in-out infinite}
.dots3{display:flex;gap:8px;margin-top:8px}.dots3 i{width:9px;height:9px;border-radius:50%;background:rgba(20,32,28,.55);animation:bnc 1s ease-in-out infinite}.dots3 i:nth-child(2){animation-delay:.15s}.dots3 i:nth-child(3){animation-delay:.3s}
@keyframes flo{50%{transform:translateY(-8px) rotate(-2deg)}}
@keyframes pls{50%{transform:scale(1.15);opacity:.6}}
@keyframes bnc{0%,80%,100%{transform:scale(.6);opacity:.5}40%{transform:scale(1);opacity:1}}
.cam1{display:flex;gap:8px;align-items:center;justify-content:center;cursor:pointer;padding:12px 8px;font-size:14px}.cam1 .gi{width:26px;height:26px;flex:none}
.pcs{display:flex;align-items:flex-end;justify-content:center;gap:8px;padding-top:4px}
.pc{flex:1;max-width:112px;display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}.pc.e{visibility:hidden}
.pm .gi{width:36px;height:36px}
.pav{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#14201c;background:linear-gradient(135deg,#ffd7b5,#ffb8cf);border:2px solid #fff;box-shadow:var(--sh2);margin-top:-6px}
.c1 .pav{width:62px;height:62px;font-size:19px}
.pn{font-size:13px;margin-top:6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc small{font-size:11px;color:var(--mu)}
.pb{width:100%;margin-top:8px;border-radius:18px 18px 0 0;display:grid;place-items:start center;padding-top:8px;font-size:22px;font-weight:800;border:1px solid rgba(255,255,255,.85);border-bottom:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.95)}.pb i{font-style:normal}
.c1 .pb{height:96px;background:linear-gradient(180deg,rgba(255,229,138,.95),rgba(255,181,50,.5));color:#9a5b00}

.c3 .pb{height:54px;background:linear-gradient(180deg,rgba(255,208,170,.95),rgba(224,138,78,.5));color:#9c4f1a}

body{width:100%;max-width:none;margin:0;padding:0}

.pet-meter{height:7px;border-radius:20px;background:rgba(110,140,160,.15);overflow:hidden;margin-top:5px}.pet-meter i{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,#a9e8dc,#9eb9ff,#d9aaff);transition:width .5s}
.pet-art{width:var(--pet-size);height:var(--pet-size);position:relative;border-radius:44% 56% 52% 48%;display:grid;place-items:center;background:var(--pet-skin);box-shadow:inset -9px -10px 18px rgba(70,80,150,.12),inset 5px 5px 12px rgba(255,255,255,.85),0 12px 22px rgba(100,110,180,.18);animation:petFloat 3s ease-in-out infinite}

.pet-art small{position:absolute;right:4px;bottom:4px;font-size:calc(var(--pet-size)*.2)}

.pet-game{grid-column:1/-1;padding:10px!important;margin:0!important}
.pet-profile{margin-bottom:14px}

.pet-subhead{font-size:15px;margin:18px 0 10px}
.pet-choices,.pet-skins{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}
.pet-choice,.pet-skin{border:1px solid var(--ln);border-radius:15px;padding:8px 3px;background:rgba(255,255,255,.58);display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.pet-choice span{width:40px;height:40px;border-radius:15px;display:grid;place-items:center;font-size:23px}
.pet-choice b,.pet-skin b{font-size:10px}.pet-choice.chosen,.pet-skin.chosen{border:2px solid #8f9fff;background:#f4f3ff}
.pet-skin span{font-size:22px}.pet-skin small{font-size:9px;color:var(--mu)}.pet-skin.locked{opacity:.48}
.pet-gamebox,.pet-admin{margin-top:16px;padding:13px;border-radius:18px;background:rgba(235,242,255,.65)}

.pet-admin{background:rgba(255,239,221,.6)}
@media(max-width:380px){.pet-card{grid-template-columns:90px 1fr}.pet-choices,.pet-skins{gap:4px}.pet-choice span{width:34px;height:34px}}

async function mark(uid,present){
 const eid=S.scanEv;if(!eid)return toast('Pilih acara dulu');
 const has=S.att.some(x=>x.event_id===eid&&x.user_id===uid);
 let r;if(present===true||(present===undefined&&!has))r=await sb.from('attendance').upsert({event_id:eid,user_id:uid,class_id:S.cls.id});else r=await sb.from('attendance').delete().eq('event_id',eid).eq('user_id',uid);
 if(r.error)return toast(r.error.message);await refresh();
}
async function shrink(f){if(!f.type.startsWith('image/')||f.type==='image/gif')return f;try{const b=await createImageBitmap(f),k=Math.min(1,1280/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);c.getContext('2d').drawImage(b,0,0,c.width,c.height);const bl=await new Promise(r=>c.toBlob(r,'image/jpeg',.82));return bl&&bl.size<f.size?new File([bl],f.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'}):f}catch(e){return f}}
let curCam=null;
async function openCam(id){
 if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
 const v={width:{ideal:1280},height:{ideal:720}};if(id)v.deviceId={exact:id};else v.facingMode={ideal:'environment'};
 stream=await navigator.mediaDevices.getUserMedia({audio:false,video:v});
 const tr=stream.getVideoTracks()[0];
 try{const c=tr.getCapabilities&&tr.getCapabilities();if(c&&c.zoom&&c.zoom.max>=1)await tr.applyConstraints({advanced:[{zoom:Math.max(1,c.zoom.min)}]})}catch(e){}
 return (tr.getSettings()||{}).deviceId;
}
async function backCams(){const d=(await navigator.mediaDevices.enumerateDevices()).filter(x=>x.kind==='videoinput'&&/back|rear|belakang|environment/i.test(x.label));return d.sort((a,b)=>(parseInt((a.label.match(/\d+/)||[99])[0])-parseInt((b.label.match(/\d+/)||[99])[0])))}
async function swapCam(){try{const bc=await backCams();if(bc.length<2)return toast('Hanya ada satu kamera belakang');const i=bc.findIndex(x=>x.deviceId===curCam);curCam=await openCam(bc[(i+1)%bc.length].deviceId);try{localStorage.setItem('kcam',curCam)}catch(e){}const v=document.querySelector('#camwrap video');if(v){v.srcObject=stream;await v.play()}toast('Kamera diganti')}catch(e){toast('Gagal mengganti kamera')}}
async function startCam(){
 let sv=null;try{sv=localStorage.getItem('kcam')}catch(e){}
 try{curCam=await openCam(sv)}catch(e){try{curCam=await openCam(null)}catch(e2){return toast('Kamera tidak bisa dibuka. Izinkan akses kamera.')}}
 if(!sv){try{const bc=await backCams();if(bc.length>1&&bc[0].deviceId!==curCam){curCam=await openCam(bc[0].deviceId)}}catch(e){}}
 const w=$('#camwrap');w.innerHTML='<video class="cam" playsinline muted></video><div class="two"><button class="btn s" data-act="swapcam">Ganti kamera</button><button class="btn s" data-act="stopcam">Tutup kamera</button></div>';
 const v=w.querySelector('video');v.srcObject=stream;await v.play();
 const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});let last='',lt=0;
 const bd='BarcodeDetector' in window?new BarcodeDetector({formats:['qr_code']}):null;
 const tick=async()=>{if(!stream)return;
  if(v.readyState>=2){let txt=null;
   if(bd){try{const r=await bd.detect(v);if(r[0])txt=r[0].rawValue}catch(e){}}
   else{cv.width=v.videoWidth;cv.height=v.videoHeight;cx.drawImage(v,0,0);const q=jsQR(cx.getImageData(0,0,cv.width,cv.height).data,cv.width,cv.height);if(q)txt=q.data}
   if(txt&&(txt!==last||Date.now()-lt>4000)){last=txt;lt=Date.now();const p=txt.split(':');
    if(p[0]==='KELASKU'&&p[1]===S.cls.id){const m=S.members.find(x=>x.user_id===p[2]);if(m){await mark(p[2],true);toast(m.name+' tercatat hadir');if(navigator.vibrate)navigator.vibrate(80)}else toast('Anggota tidak dikenal')}else toast('QR bukan dari kelas ini')}}
  requestAnimationFrame(tick)};tick();
}
function stopCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}const w=$('#camwrap');if(w)w.innerHTML=''}
let timers=[];
function schedule(){timers.forEach(clearTimeout);timers=[];if(!('Notification' in window)||Notification.permission!=='granted')return;
 S.events.forEach(e=>{const ms=new Date(e.starts_at)-Date.now()-36e5;if(ms>0&&ms<2147e6)timers.push(setTimeout(()=>notify('Pengingat: '+e.title,'Mulai pukul '+tm(e)+' di '+e.location),ms))})}
async function notify(t,b){try{const r=await navigator.serviceWorker.getRegistration();r?r.showNotification(t,{body:b,icon:'icon.svg'}):new Notification(t,{body:b})}catch(e){}}
document.addEventListener('click',async ev=>{
 const t=ev.target.closest('[data-tab],[data-pet],[data-skin],[data-sel],[data-ev],[data-act],[data-mon],[data-mark],[data-am],[data-promote],[data-go],[data-back],[data-mood],[data-done],[data-vote],[data-kas],[data-pay],[data-del],[data-dis]');if(!t)return;const d=t.dataset;
 if(d.pet){savePet({type:d.pet});render();toast('Karakter berhasil diganti')}
 else if(d.skin){savePet({skin:d.skin});render();toast('Skin dipakai')}
 else if(d.go||d.back){S.tab=d.go||'home';render();const c=$('#sc');if(c)c.scrollTop=0}
 else if(d.dis){const a=getDis();a.push(d.dis);try{localStorage.setItem('kdis',JSON.stringify(a))}catch(e){}render()}
 else if(d.mood!==undefined){db(sb.from('moods').upsert({class_id:CID(),user_id:S.user.id,day:key(new Date()),mood:+d.mood},{onConflict:'class_id,user_id,day'}),'Mood tercatat '+MOODS[+d.mood][0])}
 else if(d.done){const has=S.task_done.some(x=>x.task_id===d.done&&x.user_id===S.user.id);db(has?sb.from('task_done').delete().eq('task_id',d.done).eq('user_id',S.user.id):sb.from('task_done').insert({task_id:d.done,class_id:CID(),user_id:S.user.id}))}
 else if(d.vote){db(sb.from('poll_votes').upsert({poll_id:d.vote,class_id:CID(),user_id:S.user.id,choice:+d.i},{onConflict:'poll_id,user_id'}),'Suara tercatat')}
 else if(d.kas)kasModal(d.kas);
 else if(d.pay){const has=S.kas_paid.some(x=>x.item_id===d.k&&x.user_id===d.u);db(has?sb.from('kas_paid').delete().eq('item_id',d.k).eq('user_id',d.u):sb.from('kas_paid').insert({item_id:d.k,user_id:d.u,class_id:CID()}))}
 else if(d.del){if(confirm('Hapus item ini?'))db(sb.from(d.del).delete().eq('id',d.id),'Dihapus')}
 else if(d.am){S.authMode=d.am;render()}
 else if(d.tab){S.tab=d.tab;render()}
 else if(d.sel){S.sel=d.sel;if(!d.cal&&S.tab!=='home')S.tab='home';render()}
 else if(d.ev)evModal(d.ev);
 else if(d.mon){const[y,m]=S.mon.split('-').map(Number),n=new Date(y,m-1+ +d.mon,1);S.mon=n.getFullYear()+'-'+pad(n.getMonth()+1);render()}
 else if(d.mark)mark(d.mark);
 else if(d.promote){const r=await sb.from('members').update({role:d.r==='admin'?'member':'admin'}).eq('class_id',S.cls.id).eq('user_id',d.promote);r.error?toast(r.error.message):refresh()}
 else if(d.act==='petsave'){const n=$('#petname')?.value.trim();if(!n)return toast('Isi nama karakter dulu');savePet({name:n});render();toast('Nama karakter disimpan')}
 else if(d.act==='petgame'){const p=petData(),day=key(new Date());if(p.gameDay===day)return toast('Mini game hari ini sudah dimainkan. Besok main lagi ya!');savePet({bonus:Math.min(58,(p.bonus||0)+18),gameDay:day});render();toast('Yeay! Karaktermu makin bersemangat ✨')}
 else if(d.act==='petunlock'){if($('#petcode')?.value.trim()==='KELASKU-CREATOR-2026'){savePet({adminSkin:'galaxy',allUnlocked:true});render();toast('Semua skin kreator terbuka!')}else toast('Kode kreator tidak sesuai')}
 else if(d.act==='auth'){const e=$('#ae').value.trim(),p=$('#ap').value,up=S.authMode==='up';if(!e||p.length<6)return toast('Isi email dan kata sandi (min. 6 karakter)');
  let r;if(up){const n=$('#an').value.trim();if(!n)return toast('Isi nama lengkap');r=await sb.auth.signUp({email:e,password:p,options:{data:{name:n}}});if(!r.error&&!r.data.session)return toast('Cek email untuk konfirmasi, lalu masuk.')}else r=await sb.auth.signInWithPassword({email:e,password:p});
  if(r.error)toast(r.error.message.includes('Invalid login')?'Email atau kata sandi salah':r.error.message)}
 else if(d.act==='join'){const c=$('#jc').value.trim().toUpperCase();if(!c)return toast('Isi kode undangan');const r=await sb.rpc('join_class',{p_code:c,p_name:S.user.user_metadata.name||S.user.email});r.error?toast(r.error.message):refresh()}
 else if(d.act==='create'){const n=$('#cn').value.trim();if(!n)return toast('Isi nama kelas');const r=await sb.rpc('create_class',{p_class:n,p_name:S.user.user_metadata.name||S.user.email});r.error?toast(r.error.message):refresh()}
 else if(d.act==='resetcfg'){localStorage.removeItem('kelasku_cfg');location.reload()}
 else if(d.act==='new')(SUBF[S.tab]||formModal)();
 else if(d.act==='lite'){const l=document.documentElement.classList.toggle('lite');try{localStorage.setItem('klite',l?'1':'0')}catch(e){}render();toast(l?'Mode ringan aktif':'Efek kaca aktif')}
 else if(d.act==='bday'){const v=$('#bd').value;if(!v)return toast('Pilih tanggal');db(sb.rpc('set_birthday',{p_date:v}),'Tanggal lahir disimpan')}
 else if(d.act==='myqr'){S.tab='qr';render()}
 else if(d.act==='cam')startCam();
 else if(d.act==='stopcam')stopCam();
 else if(d.act==='swapcam')swapCam();
 else if(d.act==='all'){const r=$('#evs');r&&r.scrollIntoView({behavior:'smooth'})}
 else if(d.act==='notif'){if(!('Notification' in window))return toast('Browser belum mendukung notifikasi');const p=await Notification.requestPermission();toast(p==='granted'?'Pengingat 1 jam sebelum acara aktif':'Notifikasi tidak diizinkan');schedule()}
 else if(d.act==='share'){const txt=`Gabung kelas ${S.cls.name} di Kelasku. Buka ${location.origin+location.pathname} lalu masukkan kode: ${S.cls.code}`;if(navigator.share)navigator.share({text:txt}).catch(()=>{});else{try{await navigator.clipboard.writeText(txt);toast('Undangan disalin')}catch(e){toast(txt)}}}
 else if(d.act==='leave'){if(!confirm('Keluar dari kelas ini?'))return;const r=await sb.from('members').delete().eq('class_id',S.cls.id).eq('user_id',S.user.id);r.error?toast(r.error.message):refresh()}
 else if(d.act==='logout'){await sb.auth.signOut();S.cls=null;if(chan){sb.removeChannel(chan);chan=null}}
});
document.addEventListener('change',e=>{if(e.target.id==='se'){S.scanEv=e.target.value;render()}});
setInterval(()=>{const el=document.getElementById('cd');if(el)el.textContent=cdText(new Date(el.dataset.t)-Date.now())+' lagi'},30000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
try{const p=localStorage.getItem('klite');if(p==='1'||(p===null&&navigator.deviceMemory&&navigator.deviceMemory<=2))document.documentElement.classList.add('lite')}catch(e){}
boot();
</script>
</body>
