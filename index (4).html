async function shrink(f){if(!f.type.startsWith('image/')||f.type==='image/gif')return f;try{const b=await createImageBitmap(f),k=Math.min(1,1280/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);c.getContext('2d').drawImage(b,0,0,c.width,c.height);const bl=await new Promise(r=>c.toBlob(r,'image/jpeg',.82));return bl&&bl.size<f.size?new File([bl],f.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'}):f}catch(e){return f}}

async function openCam(id){

 const v={width:{ideal:1280},height:{ideal:720}};if(id)v.deviceId={exact:id};else v.facingMode={ideal:'environment'};
 stream=await navigator.mediaDevices.getUserMedia({audio:false,video:v});
 const tr=stream.getVideoTracks()[0];
 try{const c=tr.getCapabilities&&tr.getCapabilities();if(c&&c.zoom&&c.zoom.max>=1)await tr.applyConstraints({advanced:[{zoom:Math.max(1,c.zoom.min)}]})}catch(e){}
 return (tr.getSettings()||{}).deviceId;
}
async function backCams(){const d=(await navigator.mediaDevices.enumerateDevices()).filter(x=>x.kind==='videoinput'&&/back|rear|belakang|environment/i.test(x.label));return d.sort((a,b)=>(parseInt((a.label.match(/\d+/)||[99])[0])-parseInt((b.label.match(/\d+/)||[99])[0])))}
async function swapCam(){try{const bc=await backCams();if(bc.length<2)return toast('Hanya ada satu kamera belakang');const i=bc.findIndex(x=>x.deviceId===curCam);curCam=await openCam(bc[(i+1)%bc.length].deviceId);try{localStorage.setItem('kcam',curCam)}catch(e){}const v=document.querySelector('#camwrap video');if(v){v.srcObject=stream;await v.play()}toast('Kamera diganti')}catch(e){toast('Gagal mengganti kamera')}}
async function startCam(){
 let sv=null;try{sv=localStorage.getItem('kcam')}catch(e){}
 try{curCam=await openCam(sv)}catch(e){try{curCam=await openCam(null)}catch(e2){return toast('Kamera tidak bisa dibuka. Izinkan akses kamera.')}}
 if(!sv){try{const bc=await backCams();if(bc.length>1&&bc[0].deviceId!==curCam){curCam=await openCam(bc[0].deviceId)}}catch(e){}}
 const w=$('#camwrap');w.innerHTML='<video class="cam" playsinline muted></video><div class="two"><button class="btn s" data-act="swapcam">Ganti kamera</button><button class="btn s" data-act="stopcam">Tutup kamera</button></div>';
 const v=w.querySelector('video');v.srcObject=stream;await v.play();
 const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});let last='',lt=0;
 const bd='BarcodeDetector' in window?new BarcodeDetector({formats:['qr_code']}):null;
 const tick=async()=>{if(!stream)return;
  if(v.readyState>=2){let txt=null;
   if(bd){try{const r=await bd.detect(v);if(r[0])txt=r[0].rawValue}catch(e){}}
   else{cv.width=v.videoWidth;cv.height=v.videoHeight;cx.drawImage(v,0,0);const q=jsQR(cx.getImageData(0,0,cv.width,cv.height).data,cv.width,cv.height);if(q)txt=q.data}
   if(txt&&(txt!==last||Date.now()-lt>4000)){last=txt;lt=Date.now();const p=txt.split(':');
    if(p[0]==='KELASKU'&&p[1]===S.cls.id){const m=S.members.find(x=>x.user_id===p[2]);if(m){await mark(p[2],true);toast(m.name+' tercatat hadir');if(navigator.vibrate)navigator.vibrate(80)}else toast('Anggota tidak dikenal')}else toast('QR bukan dari kelas ini')}}
  requestAnimationFrame(tick)};tick();
}

async function recStart(){

  const mt=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'].find(t=>MediaRecorder.isTypeSupported(t))||'';
  const mr=mt?new MediaRecorder(st,{mimeType:mt}):new MediaRecorder(st);

  mr.ondataavailable=e=>{if(e.data&&e.data.size)r.ch.push(e.data)};mr.start(250);

function hallPg(){const uid=S.user.id,own=k6own(uid),st=k6stats(uid),okL=TRP.map(t=>trOK(t,st)),n=okL.filter(Boolean).length,xs=SEC.map((_,i)=>K6.owner||!!own['x'+i]),nx=xs.filter(Boolean).length+HUM.filter((_,i)=>K6.owner||own['h'+i]).length,topI=okL.lastIndexOf(true),first=okL.indexOf(false);
 const tr=topI>=0?TRP[topI]:null,part=[...Array(16)].map((_,i)=>`<i style="left:${(i*37+11)%96}%;animation-delay:${(i*.7).toFixed(1)}s;animation-duration:${(5+i%4*1.6).toFixed(1)}s"></i>`).join('');
 const gal=TRP.map((t,i)=>{const ok=okL[i],p=t.p(st),pc=Math.min(100,Math.round(p[0]/p[1]*100));return `<button class="hl-tr${ok?'':' lock'}" data-k6="trp" data-i="${i}"><span class="hl-tw">${trophySvg(t.k,t.m,96)}</span>${ok?'':'<span class="hl-lk">🔒</span>'}<b>${ok?esc(t.n):'Piala tersembunyi'}</b><small>${esc(t.q)}</small>${ok?'<em class="hl-ok">Terbuka</em>':`<span class="hl-pb"><i style="width:${pc}%"></i></span><em>${Math.min(p[0],p[1])}/${p[1]}</em>`}</button>`}).join('');
 const hs=HUM.map((s,i)=>{const ok=K6.owner||!!own['h'+i];return `<button class="hl-case hum${ok?'':' lock'}" style="--gl:${s.gl}" data-k6="item" data-id="h${i}"><i class="hl-lt"></i><span class="hl-cw">${human(i,104,{anim:ok})}</span>${ok?`<b>${esc(s.n)}</b><small>${esc(s.role)}</small>`:`<b>? ? ?</b><small>${i===7?'Temukan 7 lainnya dulu':'Belum ditemukan'}</small>`}<i class="hl-gl"></i></button>`}).join('');
 const cs=SEC.map((s,i)=>{const ok=xs[i];return `<button class="hl-case${ok?'':' lock'}" style="--gl:${s.gl}" data-k6="item" data-id="x${i}"><i class="hl-lt"></i><span class="hl-cw">${critter(i,118,{anim:ok})}</span>${ok?`<b>${esc(s.n)}</b><small>Elemen ${esc(s.el)}</small>`:`<b>? ? ?</b><small>${i===7?'Temukan 7 lainnya dulu':'Belum ditemukan'}</small>`}<i class="hl-gl"></i></button>`}).join('');
 return `<div class="hallw"><div class="hl-hero"><i class="hl-beam b1"></i><i class="hl-beam b2"></i><i class="hl-beam b3"></i><div class="hl-pt">${part}</div>
<button class="hl-bk" data-go="me" aria-label="Kembali">‹</button>${K6.owner?'<span class="hl-own">Mode pemilik</span>':''}

<div class="hl-sh"><i></i><span>Galeri Piala</span><i></i></div><p class="hl-p">Kemenangan sulit. Tiap piala butuh perjuangan panjang.</p><div class="hl-g">${gal}</div>

function k6detail(id){const it=ITB[id];if(!it)return;const own=k6own(S.user.id),has=K6.owner||!!own[id];
 modal={html:()=>{if(!has)return `<div class="k6dt"><div class="k6stg r${it.r} off"><i class="k6aura"></i>${it.t==='c'?`<div class="k6lw k6cl">${k6card(it.i)}</div>`:`<span class="k6lw">${k6art(it,it.t==='x'?200:170)}</span>`}</div>${k6rib(it.r)}<h2>Belum ditemukan</h2><p class="mu">${(it.t==='x'||it.t==='h')?(it.i===7?'Yang paling langka dari semuanya. Temukan dulu tujuh teman satu golongannya, lalu keberuntungan akan membawanya padamu.':'Karakter rahasia ini hanya muncul dari kapsul. Peluangnya kecil, tapi streak yang panjang menambah kesempatan.'):'Dapatkan dari kapsul hadiah. Setiap kenaikan streak memberi satu kapsul.'}</p></div>`;
  let ex='';if(it.t==='x'||it.t==='h'){const s=it.t==='x'?SEC[it.i]:HUM[it.i],cp=localStorage.getItem('k6comp')===id;ex=`<div class="k6fx">${it.t==='x'?`<div><small>Elemen</small><b>${s.el}</b></div><div><small>Kemampuan</small><b>${s.ab}</b></div><div><small>Favorit</small><b>${s.snack}</b></div>`:`<div><small>Julukan</small><b>${s.role}</b></div><div><small>Hobi</small><b>${s.hobby}</b></div><div><small>Jurus</small><b>${s.mv}</b></div>`}</div><button class="btn${cp?' s':''}" data-k6="comp" data-i="${id}">${cp?'Lepas dari profil':'Jadikan pendamping di profil'}</button>`}
  const n=own[id]||0;return `<div class="k6dt">${k6big(it)}<div class="k6mt">${k6rib(it.r)}<span class="k6ty">${TN6[it.t]} · No.${pad2(it.i)}</span></div><h2>${esc(it.n)}</h2>${it.t==='c'?'':`<p class="mu">${esc(it.d)}</p>`}${K6.owner?'<p class="k6ow">Dibuka lewat mode pemilik</p>':n>1?`<p class="mu">Kamu punya ${n} buah.</p>`:''}${ex}</div>`}};render()}
function k6trp(i){const t=TRP[i],st=k6stats(S.user.id),ok=trOK(t,st),p=t.p(st),pc=Math.min(100,Math.round(p[0]/p[1]*100));
 modal={html:()=>`<div class="k6dt hall"><div class="k6stg r3 ${ok?'':'off'}"><i class="k6aura"></i><span class="${ok?'':'k6lw'}">${trophySvg(t.k,t.m,200)}</span></div><h2>${ok?esc(t.n):'Piala tersembunyi'}</h2><p class="mu">${ok?esc(t.d):'Selesaikan tantangannya untuk melihat wujud piala ini.'}</p><div class="k6fx one"><div><small>Syarat</small><b>${esc(t.q)}</b></div></div>${ok?`<p class="k6ow" style="color:#1d9b6c">${K6.owner?'Terbuka lewat mode pemilik':'Terbuka. Selamat!'}</p>`:`<div class="gbar" style="margin:8px 0 4px"><i style="width:${pc}%"></i></div><p class="mu">Progres ${Math.min(p[0],p[1])} / ${p[1]}</p>`}</div>`};render()}
/* ---- pembukaan kapsul ---- */
function k6burst(el,col){let h='';for(let i=0;i<30;i++){const a=Math.random()*Math.PI*2,d=90+Math.random()*150,cl=['#ffd23f','#ff7aa8','#6ac6ff','#7dffb0','#fff',col][i%6];h+=`<i style="--x:${Math.cos(a)*d|0}px;--y:${Math.sin(a)*d|0}px;--r:${(Math.random()*720-360)|0}deg;background:${cl};animation-delay:${(Math.random()*.15).toFixed(2)}s;${i%3===0?'border-radius:50%':''}"></i>`}el.innerHTML=h}
function k6open(key,test){const uid=S.user.id;let res,ck=key,c0=null;
 if(test!=null){const pool=ITM.filter(i=>i.r===test),it=pool[Math.floor(Math.random()*pool.length)];res={id:it.id,r:test,n:1};ck=null;c0={k:'test',min:test>=3?1:0}}
 else{const C=k6caps(uid),o=new Set(k6op(uid)),pe=C.L.filter(c=>!o.has(c.k));if(!pe.length)return toast('Belum ada kapsul. Check-in besok untuk dapat yang baru!');c0=key?pe.find(c=>c.k===key):pe[0];if(!c0)c0=pe[0];ck=c0.k;res=C.res[ck]}
 const it=ITB[res.id],R=KR[res.r],left=test!=null?0:k6pend(uid).length;
 document.querySelectorAll('.k6ov').forEach(x=>x.remove());
 const ov=document.createElement('div');ov.className='k6ov rr'+res.r;ov.style.setProperty('--rc',R.g);ov.style.setProperty('--ra',R.a);
 ov.innerHTML=`<button class="k6x" data-k6="oclose" aria-label="Tutup">✕</button><i class="k6rays"></i><div class="k6cw"><div class="k6cap" data-k6="crack">${capOf(c0,210)}</div><p class="k6hint">Ketuk kapsul untuk membuka</p></div><i class="k6fl"></i><div class="k6bs"></div><div class="k6res"></div>`;
 document.body.appendChild(ov);let busy=0;
 ov._crack=()=>{if(busy)return;busy=1;const cap=ov.querySelector('.k6cap');ov.classList.add('shk');if(navigator.vibrate)navigator.vibrate([30,40,30,40,60]);
  setTimeout(()=>{ov.classList.remove('shk');ov.classList.add('cr');if(ck)k6setOp(uid,ck);k6burst(ov.querySelector('.k6bs'),R.g);if(navigator.vibrate)navigator.vibrate(res.r>=3?[80,40,120]:40);
   setTimeout(()=>{const nm=res.r===4?'KARAKTER RAHASIA!':res.r===3?'LEGENDARIS!':res.r===2?'EPIK!':res.r===1?'LANGKA!':'DAPAT!';
    ov.querySelector('.k6res').innerHTML=`<div class="k6rt r${res.r}">${nm}</div><div class="k6ri">${it.t==='c'?k6card(it.i,{tilt:1}):`<div class="k6stg r${it.r}"><i class="k6aura"></i>${(it.t==='x'||it.t==='h')?'<i class="k6ring"></i>':''}${k6art(it,it.t==='x'?230:it.t==='h'?196:it.t==='l'?200:190,{anim:1})}</div>`}</div><div class="k6rn">${k6rib(res.r)}<b>${esc(it.n)}</b><small>${TN6[it.t]}${test!=null?' · uji coba':res.n>1?' · duplikat ×'+res.n:''}</small>${(test!=null||res.n===1)?'<em class="k6new">BARU!</em>':''}</div><div class="k6bt">${left>0?`<button class="btn" data-k6="onext">Buka kapsul lagi (${left})</button><button class="btn s" data-k6="oclose">Selesai</button>`:`<button class="btn" data-k6="${test!=null?'oclose':'ogo'}">${test!=null?'Tutup':'Lihat koleksi'}</button>`}</div>`;ov.classList.add('sh');k6tilt()},res.r>=3?900:600)},800)};
 setTimeout(()=>{const h=ov.querySelector('.k6hint');if(h)h.classList.add('on')},600)}
function k6close(go){document.querySelectorAll('.k6ov').forEach(x=>{x.classList.add('out');setTimeout(()=>x.remove(),220)});K6CC={};if(go)S.tab='koleksi';render()}
/* ---- tilt kartu ---- */
function k6tilt(){document.querySelectorAll('.k6card.tilt:not([data-t])').forEach(c=>{c.dataset.t=1;const mv=e=>{const b=c.getBoundingClientRect(),x=((e.clientX-b.left)/b.width),y=((e.clientY-b.top)/b.height);c.style.setProperty('--ry',((x-.5)*26).toFixed(1)+'deg');c.style.setProperty('--rx',((.5-y)*26).toFixed(1)+'deg');c.style.setProperty('--mx',(x*100).toFixed(0)+'%');c.style.setProperty('--my',(y*100).toFixed(0)+'%');c.classList.add('hot')},ed=()=>{c.style.setProperty('--ry','0deg');c.style.setProperty('--rx','0deg');c.classList.remove('hot')};c.addEventListener('pointermove',mv);c.addEventListener('pointerdown',mv);c.addEventListener('pointerup',ed);c.addEventListener('pointerleave',ed);c.addEventListener('pointercancel',ed)})}
/* ---- kode pemilik ---- */
async function k6hash(code){if(!(window.crypto&&crypto.subtle))throw new Error('nocrypto');const enc=new TextEncoder(),k=await crypto.subtle.importKey('raw',enc.encode(code),'PBKDF2',false,['deriveBits']),b=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:enc.encode(K6SALT),iterations:K6IT},k,256);return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const k6ownerRow=()=>`<button class="btn s k6key" data-k6="owner" style="margin-bottom:10px">${K6.owner?'🔓 Mode pemilik: aktif':'🔑 Kode spesial'}</button>`;
function k6ownerModal(){modal={form:true,html:()=>K6.owner?`<h2>Mode pemilik</h2><p class="mu">Semua stiker, lencana, kartu, karakter rahasia, dan piala terbuka di perangkat ini. Anggota lain tidak terpengaruh.</p><div class="sh" style="padding:6px 0"><span>Uji animasi kapsul</span></div><div class="k6tst">${KR.map((r,i)=>`<button class="k6tb r${i}" data-k6="test" data-r="${i}">${r.n}</button>`).join('')}</div><button class="btn d" data-k6="ownoff" style="margin-top:14px">Matikan mode pemilik</button>`:`<h2>Kode spesial</h2><p class="mu">Khusus pembuat aplikasi. Masukkan kode untuk membuka semua fitur spesial.</p><input id="k6code" type="password" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Masukkan kode"><button class="btn" data-k6="ownok">Buka</button><p class="mu" id="k6msg" style="margin-top:8px"></p>`};render()}
async function k6ownOk(){const i=$('#k6code'),m=$('#k6msg');if(!i)return;const now=Date.now();if(now<K6.lockUntil){m.textContent='Terlalu banyak percobaan. Tunggu '+Math.ceil((K6.lockUntil-now)/1000)+' detik.';return}
 const v=i.value.trim();if(!v)return;m.textContent='Memeriksa…';let h;try{h=await k6hash(v)}catch(e){m.textContent='Perangkat/peramban ini tidak mendukung pemeriksaan kode (butuh https).';return}
 if(h===K6HASH){K6.owner=true;K6.fail=0;try{localStorage.setItem('k6ok',K6HASH)}catch(e){}toast('Mode pemilik aktif. Semua terbuka!');k6ownerModal()}
 else{K6.fail++;if(K6.fail>=4){K6.lockUntil=Date.now()+60000;K6.fail=0}m.textContent='Kode salah.'}}

meTab2=function(){let h=_me6();if(!k6can())return h;

 h=h.replace('<button class="btn s" data-pa="fs"',()=>k6ownerRow()+'<button class="btn s" data-pa="fs"');return h};
const _mn6=menu2;
menu2=function(){let h=_mn6();if(!k6can())return h;return h.replace('<div class="mgrid">',()=>`<div class="mgrid"><button class="mt" data-go="koleksi"><span class="mti" style="--c:#d9ecff">${capSvg(['#7fd0ff','#2f6fe0'],38,0)}</span><b>Koleksi</b><small>${k6pend(S.user.id).length} kapsul menunggu</small></button><button class="mt" data-go="hall"><span class="mti" style="--c:#2a1c46">${trophySvg('cup','gold',40)}</span><b>Aula Juara</b><small>Piala & rahasia</small></button>`)};
SUB.push('koleksi','hall');
window.koleksiPg=koleksiPg;window.hallPg=hallPg;window.k6homeCard=k6homeCard;
const _sm6=showModal;showModal=function(){_sm6();k6tilt()};
const _rd6=render;render=function(){_rd6.apply(this,arguments);try{if(!k6can()||S.tab==='pick')return;const uid=S.user.id,C=k6caps(uid),n=C.L.length,k='k6s_'+uid;let seen=null;try{seen=localStorage.getItem(k)}catch(e){}
 if(seen===null||+seen<n){const nw=seen===null?k6pend(uid).length:n-+seen;try{localStorage.setItem(k,String(n))}catch(e){}if(nw>0&&!document.querySelector('.k6ov'))setTimeout(()=>toast('🎁 '+(nw>1?nw+' kapsul baru':'Kapsul baru')+' dari streak! Buka di Beranda.'),700)}}catch(e){}};
document.addEventListener('click',async ev=>{const t=ev.target.closest('[data-k6]');if(!t)return;const d=t.dataset,a=d.k6;
 if(a==='tab'){K6.t=d.t;render()}
 else if(a==='item')k6detail(d.id);
 else if(a==='trp')k6trp(+d.i);
 else if(a==='open')k6open();
 else if(a==='crack'){const o=t.closest('.k6ov');o&&o._crack&&o._crack()}
 else if(a==='onext'){k6close();setTimeout(()=>k6open(),260)}
 else if(a==='oclose')k6close();
 else if(a==='ogo')k6close(1);
 else if(a==='comp'){const i=String(d.i),cur=localStorage.getItem('k6comp');try{cur===i?localStorage.removeItem('k6comp'):localStorage.setItem('k6comp',i)}catch(e){}toast(cur===i?'Pendamping dilepas':ITB[i].n+' kini menemani di profilmu');closeModal()}
 else if(a==='owner')k6ownerModal();
 else if(a==='ownok')k6ownOk();
 else if(a==='ownoff'){K6.owner=false;try{localStorage.removeItem('k6ok')}catch(e){}toast('Mode pemilik dimatikan');closeModal()}

})();
